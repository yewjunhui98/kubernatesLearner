# Requires Calico (or another policy-capable CNI). See COMMANDS.md.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: net-lab
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-echo-from-client
  namespace: net-lab
spec:
  podSelector:
    matchLabels:
      app: echo
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: client
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: client-allowed
  namespace: net-lab
  labels:
    app: client
spec:
  containers:
    - name: client
      image: busybox:1.36
      command: ["/bin/sh", "-c", "sleep 3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: client-denied
  namespace: net-lab
  labels:
    app: other
spec:
  containers:
    - name: client
      image: busybox:1.36
      command: ["/bin/sh", "-c", "sleep 3600"]
