apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: trouble-lab
data:
  MESSAGE: "hello"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cfg-miss
  namespace: trouble-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cfg-miss
  template:
    metadata:
      labels:
        app: cfg-miss
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["/bin/sh", "-c", "echo msg=$MESSAGE; sleep 3600"]
          env:
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  # BUG: key does not exist on the ConfigMap
                  key: MSG
