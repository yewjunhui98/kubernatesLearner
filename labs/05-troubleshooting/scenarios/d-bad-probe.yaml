apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe-fail
  namespace: trouble-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe-fail
  template:
    metadata:
      labels:
        app: probe-fail
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              # BUG: wrong path — nginx serves /
              path: /readyz-does-not-exist
              port: 80
            initialDelaySeconds: 1
            periodSeconds: 3
