apiVersion: batch/v1
kind: CronJob
metadata:
  name: heartbeat
  namespace: podman-lab
spec:
  schedule: "*/2 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: echo
              image: busybox:1.36
              command: ["/bin/sh", "-c", "date; echo heartbeat-from-cronjob"]
