apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-demo
  namespace: workloads-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secret-demo
  template:
    metadata:
      labels:
        app: secret-demo
    spec:
      containers:
        - name: demo
          image: busybox:1.36
          command: ["/bin/sh", "-c", "echo token=$APP_TOKEN; ls -l /secrets; sleep 3600"]
          env:
            - name: APP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: demo-secret
                  key: APP_TOKEN
          volumeMounts:
            - name: secret-vol
              mountPath: /secrets
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
      volumes:
        - name: secret-vol
          secret:
            secretName: demo-secret
