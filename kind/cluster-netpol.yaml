# Use this config when you need NetworkPolicy (Calico).
# Recreate the cluster: kind delete cluster --name podman-lab
# then: kind create cluster --config kind/cluster-netpol.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: podman-lab
networking:
  disableDefaultCNI: true
  podSubnet: "192.168.0.0/16"
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 80
        hostPort: 8081
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
  - role: worker
  - role: worker
